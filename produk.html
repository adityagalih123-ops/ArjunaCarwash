<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Master Produk - Arjuna Cakra Clean</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="produk">
  <div id="shell"></div>

  <main class="content">
    <div class="page-header">
      <div>
        <h1>Master Produk</h1>
        <p>Kelola daftar layanan / produk cucian mobil</p>
      </div>
      <button class="btn btn-primary" id="btnTambah">+ Tambah Produk</button>
    </div>

    <div class="card">
      <div class="search-box">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" stroke-width="1.8"/><path d="M21 21l-4.5-4.5" stroke-width="1.8" stroke-linecap="round"/></svg>
        <input type="text" id="searchInput" placeholder="Cari nama produk..." />
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nama Item</th>
              <th class="text-right">Harga Jual</th>
              <th class="text-right">HPP</th>
              <th class="text-center">Status</th>
              <th class="text-right">Aksi</th>
            </tr>
          </thead>
          <tbody id="produkTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display:none;">
        <svg viewBox="0 0 24 24"><path d="M3.5 7.5 12 3l8.5 4.5V17L12 21.5 3.5 17Z" stroke-width="1.6"/></svg>
        <p>Belum ada produk. Klik "Tambah Produk" untuk membuat yang pertama.</p>
      </div>
    </div>
  </main>

  <!-- Modal Tambah/Edit Produk -->
  <div class="modal-backdrop" id="produkModal">
    <div class="modal">
      <h3 class="modal-title" id="modalTitle">Tambah Produk</h3>
      <form id="produkForm">
        <input type="hidden" id="produkId" />
        <div class="form-group">
          <label for="namaItem">Nama Item</label>
          <input type="text" id="namaItem" placeholder="Contoh: Cuci Mobil Reguler" required />
        </div>
        <div class="form-row cols-2">
          <div class="form-group">
            <label for="hargaJual">Harga Jual</label>
            <input type="number" id="hargaJual" min="0" step="500" required />
          </div>
          <div class="form-group">
            <label for="hpp">HPP (Harga Pokok)</label>
            <input type="number" id="hpp" min="0" step="500" required />
          </div>
        </div>
        <div class="form-group">
          <label for="statusAktif">Status</label>
          <select id="statusAktif">
            <option value="true">Aktif</option>
            <option value="false">Tidak Aktif</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" id="btnBatal">Batal</button>
          <button type="submit" class="btn btn-primary" id="btnSimpanProduk">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/produk.js"></script>
</body>
</html>
