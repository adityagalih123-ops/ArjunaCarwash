<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Laporan Item Terjual - Arjuna Cakra Clean</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="laporan-item">
  <div id="shell"></div>

  <main class="content">
    <div class="page-header">
      <div>
        <h1>Laporan Item Terjual</h1>
        <p>Rekap penjualan per produk</p>
      </div>
      <button class="btn btn-outline" id="btnExportCsv">Export CSV</button>
    </div>

    <div class="card mb-16">
      <div class="form-row cols-3">
        <div class="form-group" style="margin-bottom:0;">
          <label for="filterFrom">Dari Tanggal</label>
          <input type="date" id="filterFrom" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="filterTo">Sampai Tanggal</label>
          <input type="date" id="filterTo" />
        </div>
        <div class="form-group" style="margin-bottom:0;">
          <label for="sortBy">Urutkan Berdasarkan</label>
          <select id="sortBy">
            <option value="qty">Qty Terjual (Terbanyak)</option>
            <option value="omzet">Omzet (Tertinggi)</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary mt-16" id="btnFilter">Terapkan Filter</button>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nama Item</th>
              <th class="text-right">Qty Terjual</th>
              <th class="text-right">Omzet</th>
              <th class="text-right">Biaya Gaji</th>
              <th class="text-right">Biaya Operasional</th>
              <th class="text-right">Laba Bersih</th>
            </tr>
          </thead>
          <tbody id="itemTableBody"></tbody>
        </table>
      </div>
      <div id="itemEmpty" class="empty-state" style="display:none;">
        <p>Tidak ada data penjualan pada rentang tanggal ini.</p>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/laporan-item.js"></script>
</body>
</html>
