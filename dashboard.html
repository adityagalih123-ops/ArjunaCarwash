<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Dashboard - Arjuna Cakra Clean</title>
<link rel="icon" href="assets/logo.png" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="dashboard">
  <div id="shell"></div>

  <main class="content">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <p id="todayLabel"></p>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M12 2v20M17 5.5C17 4 15 3 12 3s-5 1.3-5 3.3c0 4.4 10 2.2 10 6.7 0 2-2 3.3-5 3.3s-5-1-5-2.8" stroke-width="1.8" stroke-linecap="round"/></svg></div>
        <div class="stat-label">Omzet Hari Ini</div>
        <div class="stat-value" id="statOmzet">Rp 0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M4 20V10M11 20V4M18 20v-7" stroke-width="2" stroke-linecap="round"/></svg></div>
        <div class="stat-label">Laba Bersih</div>
        <div class="stat-value" id="statLaba">Rp 0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24"><path d="M3.5 15.5 5.6 9.7C6.1 8.3 7.4 7.4 8.9 7.4h6.2c1.5 0 2.8.9 3.3 2.3l2.1 5.8" stroke-width="1.8" stroke-linecap="round"/><rect x="3" y="15.5" width="18" height="4.5" rx="1.6" stroke-width="1.8"/><circle cx="7.5" cy="20" r="1.3"/><circle cx="16.5" cy="20" r="1.3"/></svg></div>
        <div class="stat-label">Total Kendaraan</div>
        <div class="stat-value" id="statKendaraan">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.2" fill="none" stroke-width="1.8"/><path d="M3 9.5h18" stroke-width="1.8"/><circle cx="16.5" cy="14" r="1.3"/></svg></div>
        <div class="stat-label">Total Pengeluaran</div>
        <div class="stat-value" id="statPengeluaran" style="color:var(--danger);">Rp 0</div>
      </div>
    </div>

    <div class="card">
      <strong>Shift Aktif</strong>
      <div id="activeShiftBox" class="mt-16">
        <p class="text-muted">Memuat...</p>
      </div>
    </div>

    <div class="card">
      <div class="flex-between mb-16">
        <strong>Omzet 7 Hari Terakhir</strong>
      </div>
      <div class="chart-wrap">
        <svg id="revenueChart" width="100%" height="220" viewBox="0 0 700 220" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
    </div>

  </main>

  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth-guard.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
